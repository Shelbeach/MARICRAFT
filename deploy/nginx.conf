server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Godot 4.7.2, Compatibility, single-threaded Web export (no COOP/COEP needed).
    # Explicit types make WASM streaming compilation and nosniff compatible.
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/wasm wasm;
        application/octet-stream pck;
        image/png png;
        image/svg+xml svg;
        image/x-icon ico;
        application/json json;
        text/plain txt;
    }
    default_type application/octet-stream;
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ ^/(?:SHA256SUMS|build-manifest\.json)$ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }
}
